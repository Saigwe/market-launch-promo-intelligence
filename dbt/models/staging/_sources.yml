version: 2

sources:
  - name: raw
    description: Parquet files written by generator/simulate.py, as each provider delivers them. Every number is synthetic.
    meta:
      external_location: "{{ env_var('RAW_DIR', '../data/raw') }}/{name}.parquet"
    tables:
      - name: markets
      - name: retailers
      - name: panel_coverage
      - name: fx_daily
      - name: products
      - name: product_class_history
      - name: comparable_pairs
      - name: sales_weekly
      - name: panel_weekly
        description: Retail-tracking panel. A revised delivery repeats the key with a later delivered_at.
      - name: market_monthly
        description: Independently sourced monthly market series from a second provider.
      - name: retail_prices
      - name: promotions
